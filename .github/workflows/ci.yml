name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: managed

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y gettext
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_file_size.py
      - run: scripts/check_translations.sh

  sdk:
    name: sdk (py${{ matrix.python }}, django ${{ matrix.django }}, pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        django: ["6.0", "6.1"]
        postgres: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripaulx_sdk
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - working-directory: sdk
        run: uv run --with "django~=${{ matrix.django }}.0" pytest -q

  template:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: example
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DB_NAME: example
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Render template/ into example/
        run: scripts/render_example.sh
      - name: Lint, test and check the generated project
        working-directory: example
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
          DJANGO_SETTINGS_MODULE=config.settings.test uv run python manage.py makemigrations --check --dry-run
      - name: Production settings pass check --deploy
        working-directory: example
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          APP_BASE_DOMAIN: example.com
        run: SECRET_KEY="$(openssl rand -base64 48)" uv run python manage.py check --deploy --fail-level WARNING

  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: example
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: shellcheck the shell scripts
        run: >-
          shellcheck -x template/entrypoint.sh template/healthcheck.sh
          template/deploy template/start template/pg template/scripts/*.sh
          scripts/*.sh
      - run: uv sync --locked
      # The SDK is not on PyPI yet: vendor the local checkout into the build
      # context so the image installs it as a path dependency.
      - name: Render the example with a vendored SDK
        run: |
          scripts/render_example.sh --data sdk_path=vendor/tripaulx-sdk
          mkdir -p example/vendor
          cp -R sdk example/vendor/tripaulx-sdk
          rm -rf example/vendor/tripaulx-sdk/tests
      - working-directory: example
        run: uv lock
      - name: docker build
        run: docker build -t example:ci example
      - name: Boot the web role and probe /healthz/
        run: |
          docker run -d --name web --network host \
            -e SECRET_KEY="$(openssl rand -base64 48)" \
            -e APP_BASE_DOMAIN=example.com \
            -e DB_NAME=example -e DB_USER=postgres -e DB_PASSWORD=postgres \
            -e DB_HOST=127.0.0.1 example:ci
          for _ in $(seq 1 60); do
            docker exec web /app/healthcheck.sh && break
            sleep 2
          done
          docker logs web
          docker exec web /app/healthcheck.sh
          test "$(docker exec web id -u)" != "0"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI is MIT-licensed; the gitleaks-action needs a paid
      # license on organization repositories, so run the official image.
      - name: Scan the full history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --no-banner --redact -v
