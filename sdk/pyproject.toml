[project]
name = "tripaulx-sdk"
dynamic = ["version"]
description = "Multi-tenant Django foundation: workspaces, accounts with mandatory 2FA and passkeys, AI providers, legal and storage."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Flavio Almeida Paulino", email = "f1@tripaulx.com" }]
maintainers = [{ name = "Flavio Almeida Paulino", email = "f1@tripaulx.com" }]
requires-python = ">=3.12"
classifiers = [
  "Framework :: Django",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
  "cryptography>=50.0.2",
  # Latest security patch of each supported series (6.0 and 6.1).
  "django>=6.0.10,!=6.1.0,!=6.1.1,!=6.1.2,<6.2",
  "django-cors-headers>=4.9,<5",
  "django-tenants>=4.0.4,<5",
  "djangorestframework>=3.18.3,<4",
  "djangorestframework-simplejwt>=5.5.1,<6",
  "drf-spectacular>=0.30,<1",
  "nh3>=0.3.7,<1",
  "psycopg[binary]>=3.3.9,<4",
  "python-dotenv>=1.2.4",
  "qrcode>=8.2,<9",
  "webauthn>=3.0.1,<4",
]

[project.optional-dependencies]
# S3-compatible object storage with envelope encryption (tripaulx.storage).
# boto3 >= 1.36 needs request_checksum_calculation="when_required" for
# non-AWS providers; tripaulx.storage.client sets it.
storage = [
  "boto3>=1.44,<2",
  "cryptography>=50.0.2",
  "pillow>=13",
]
# AI providers (tripaulx.ai). Each SDK is imported lazily, only when a call
# goes to that provider; "ai" installs both.
openai = ["openai>=3.52"]
anthropic = ["anthropic>=2.9"]
ai = ["openai>=3.52", "anthropic>=2.9"]

[project.urls]
Homepage = "https://github.com/tripaulx/tripaulx-builder-init"
Issues = "https://github.com/tripaulx/tripaulx-builder-init/issues"

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tripaulx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tripaulx"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.project.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
