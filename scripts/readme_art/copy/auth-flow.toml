# Copy of the auth-flow diagram (en and pt-BR).

[en]
title = "From sign-up to a signed-in workspace"
head = ["04", "Accounts", "Sign up, verify, always a second step", "Every login asks for a second factor. Tokens only work in the workspace that issued them."]
badge = "Roadmap · Phase 1"
steps = [
  ["1", "Sign up", "example.com", "Creates the workspace,\nits schema and its owner"],
  ["2", "Verify e-mail", "6-digit code", "Stored hashed, expires,\nlimited attempts"],
  ["3", "Log in", "acme.example.com", "E-mail and password,\nor a passkey"],
  ["4", "Second step", "TOTP or e-mail code", "Always on. Recovery\ncodes as a backup"],
  ["5", "Signed in", "JWT · schema=acme", "Rejected by every\nother workspace"],
]
factors = "Second factors"
cards = [
  ["Authenticator app", "Google Authenticator, Authy, 1Password", "violet"],
  ["E-mail code", "Used when no authenticator is set", "brand"],
  ["Passkey", "Biometrics or a security key", "success"],
]
note = "Passkey-only mode turns off password login while at least one passkey exists."

[pt]
title = "Do cadastro ao workspace logado"
head = ["04", "Contas", "Cadastre, verifique, sempre uma segunda etapa", "Todo login pede um segundo fator. O token só vale no workspace que o emitiu."]
badge = "Roadmap · Fase 1"
steps = [
  ["1", "Cadastro", "example.com", "Cria o workspace,\no schema e o dono"],
  ["2", "Verificar e-mail", "código de 6 dígitos", "Em hash, expira,\ntentativas limitadas"],
  ["3", "Login", "acme.example.com", "E-mail e senha,\nou uma passkey"],
  ["4", "Segunda etapa", "TOTP ou código", "Sempre ativa. Códigos\nde recuperação extras"],
  ["5", "Logado", "JWT · schema=acme", "Recusado por qualquer\noutro workspace"],
]
factors = "Segundos fatores"
cards = [
  ["Aplicativo autenticador", "Google Authenticator, Authy, 1Password", "violet"],
  ["Código por e-mail", "Usado quando não há autenticador", "brand"],
  ["Passkey", "Biometria ou chave de segurança", "success"],
]
note = "O modo só passkey desliga o login por senha enquanto houver ao menos uma passkey."
